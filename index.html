<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MedHistory - Medical History Assistant</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app-container">
    <header>
      <h1>MedHistory</h1>
      <p>Medical history documentation form</p>
    </header>

    <div id="specialty-selector" class="card">
      <h2>Select Specialty</h2>
      <div class="specialty-grid">
        <button class="specialty-btn" onclick="startAssessment('surgery')">
          <span>Surgery</span>
        </button>
        <button class="specialty-btn" onclick="startAssessment('medicine')">
          <span>Medicine</span>
        </button>
        <button class="specialty-btn" onclick="startAssessment('paediatric')">
          <span>Paediatrics</span>
        </button>
        <button class="specialty-btn" onclick="startAssessment('gynaeobs')">
          <span>Gynae / Obstetrics</span>
        </button>
      </div>
    </div>

    <div id="form-view" class="hidden">
      <div class="form-toolbar">
        <div class="toolbar-info">
          <span id="toolbar-specialty"></span>
          <span id="toolbar-condition" class="toolbar-condition"></span>
        </div>
        <div class="toolbar-actions">
          <button class="btn btn-primary" onclick="printForm()">Print / Save PDF</button>
          <button class="btn btn-secondary" onclick="resetApp()">New Assessment</button>
        </div>
      </div>
      <div id="form-content"></div>
    </div>
  </div>

  <script src="js/data/questions.js"></script>
  <script src="js/specialties/surgery.js"></script>
  <script src="js/specialties/medicine.js"></script>
  <script src="js/specialties/paediatric.js"></script>
  <script src="js/specialties/gynaeobs.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
